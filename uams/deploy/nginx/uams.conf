# UAMS 正式站点（Vue SPA + /api 反向代理）
# 安装：复制到 /etc/nginx/sites-available/uams 并启用，详见 deploy/README.md
#
# 说明：
# - 只服务 /var/www/uams/current 下的前端构建产物，不暴露源码目录；
# - /api/ 原样转发到 127.0.0.1:8000（proxy_pass 末尾不加 /，保留 /api/v1/...）；
# - 教学资料仍走鉴权 API，不作为静态文件暴露；
# - 若本机已有其他站点占用 80，请调整 listen/server_name，不要覆盖现有配置。
#
# 默认站点策略：
# - 本配置**不声明** default_server，避免与 Ubuntu 默认站点产生“重复 default_server”错误；
# - 安装时先备份并停用 /etc/nginx/sites-enabled/default，使 UAMS 成为唯一监听 80 的站点，
#   这样用服务器 IP 访问时进入 UAMS，而不是 Nginx 欢迎页；
# - 如本机必须保留其他 80 站点，请使用 server_name/域名区分，不要盲目添加 default_server。

server {
    listen 80;
    listen [::]:80;
    server_name _;

    root /var/www/uams/current;
    index index.html;

    access_log /var/log/nginx/uams.access.log;
    error_log  /var/log/nginx/uams.error.log;

    server_tokens off;
    client_max_body_size 20m;

    # --- API 反向代理（^~ 优先于下面的静态正则） ---
    location ^~ /api/ {
        proxy_pass http://127.0.0.1:8000;
        proxy_http_version 1.1;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $host;

        proxy_connect_timeout 10s;
        proxy_read_timeout 60s;
        proxy_send_timeout 60s;
    }

    # --- 带哈希的构建资源：长期缓存 ---
    location ^~ /assets/ {
        try_files $uri =404;
        expires 30d;
        add_header Cache-Control "public, immutable";
    }

    # --- 入口 HTML 不缓存，避免发布后仍加载旧资源 ---
    location = /index.html {
        add_header Cache-Control "no-store, no-cache, must-revalidate";
        try_files $uri =404;
    }

    # --- SPA history 路由回退 ---
    location / {
        try_files $uri $uri/ /index.html;
    }

    # --- 禁止访问 .env / .git / 备份等敏感文件 ---
    location ~ /\.(?!well-known) {
        deny all;
        access_log off;
        log_not_found off;
    }

    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options SAMEORIGIN always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;
}
